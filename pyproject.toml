[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fiona-rag"
version = "0.1.0"
description = "Evidence-based question answering for spatiotemporal forecasting research papers"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fiona*"]
